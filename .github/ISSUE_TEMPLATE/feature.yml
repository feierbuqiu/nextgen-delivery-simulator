name: 功能建议
description: 建议符合项目宪章的新功能或改进
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 演练场景
      description: 说明需要解决的通用问题，不要引用现实机构的非公开内容。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期行为、领域约束和中文界面变化。
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 可验证标准
      description: 列出能够证明功能正确且未突破项目边界的测试。
    validations:
      required: true
  - type: checkboxes
    id: charter
    attributes:
      label: 项目宪章确认
      options:
        - label: 建议保持本机运行、虚构数据、纯中文默认体验和非生产用途。
          required: true
        - label: 建议不引入后端服务、遥测、外部接口或现实机构关联。
          required: true
