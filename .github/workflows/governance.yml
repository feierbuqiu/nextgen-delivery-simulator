name: 可信治理守卫

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: 可信治理守卫
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检查受保护边界
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullRequest = context.payload.pull_request
            const headSha = pullRequest.head.sha
            const statusContext = '治理规则未被绕过'
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const writeStatus = async (state, description) => {
              await github.rest.repos.createCommitStatus({
                ...context.repo,
                sha: headSha,
                state,
                context: statusContext,
                description,
                target_url: targetUrl,
              })
            }

            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              })
              const labels = new Set(pullRequest.labels.map((label) => label.name))
              const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR'])
              const governanceOverride =
                trustedAssociations.has(pullRequest.author_association) &&
                labels.has('治理变更') &&
                (pullRequest.body ?? '').includes('治理变更说明')

              const protectedExactPaths = new Set([
                '.node-version',
                '.npmrc',
                'ARCHITECTURE.md',
                'DATA_POLICY.md',
                'LICENSE',
                'PROJECT_CHARTER.md',
                'PUBLICATION_POLICY.md',
                'REPOSITORY_SETUP.md',
                'SECURITY.md',
                'eslint.config.js',
                'src/app/localOnly.ts',
                'src/main.tsx',
                'tsconfig.app.json',
                'tsconfig.json',
                'tsconfig.node.json',
                'vite.config.ts',
              ])
              const protectedPrefixes = ['.github/', '.githooks/', 'tools/']
              const protectedChanges = files
                .filter((file) => protectedExactPaths.has(file.filename) || protectedPrefixes.some((prefix) => file.filename.startsWith(prefix)))
                .map((file) => file.filename)
              const deletedTests = files
                .filter((file) => file.status === 'removed' && /\.test\.[cm]?[jt]sx?$/u.test(file.filename))
                .map((file) => file.filename)

              const packageResponse = await github.rest.repos.getContent({
                owner: pullRequest.head.repo.owner.login,
                repo: pullRequest.head.repo.name,
                path: 'package.json',
                ref: headSha,
              })
              if (Array.isArray(packageResponse.data) || packageResponse.data.type !== 'file') {
                throw new Error('无法读取拉取请求中的 package.json')
              }
              const packageJson = JSON.parse(Buffer.from(packageResponse.data.content, 'base64').toString('utf8'))
              const findings = []
              if (packageJson.name !== 'nextgen-delivery-simulator') findings.push('不得改变项目包名')
              if (packageJson.private !== true) findings.push('package.json 必须保持 private=true')
              if (packageJson.license !== 'MIT') findings.push('许可证必须保持 MIT')
              if (packageJson.scripts?.dev !== 'vite --host 127.0.0.1 --port 4173 --strictPort') findings.push('不得改变本机开发地址')
              if (packageJson.scripts?.preview !== 'vite preview --host 127.0.0.1 --port 4173 --strictPort') findings.push('不得改变本机预览地址')

              const guardedScripts = {
                'check:foundation': 'node tools/check-foundation.mjs',
                'check:governance': 'node tools/check-ci-governance.mjs',
                'check:local-only': 'node tools/check-local-only.mjs',
                'check:publication': 'node tools/check-publication.mjs',
                'check:release': 'npm run check && node tools/check-publication.mjs --release',
              }
              if (!governanceOverride) {
                for (const [name, expected] of Object.entries(guardedScripts)) {
                  if (packageJson.scripts?.[name] !== expected) findings.push(`不得绕过 ${name}`)
                }
                if (protectedChanges.length > 0) findings.push(`普通贡献不得修改受保护治理内容：${protectedChanges.join(', ')}`)
                if (deletedTests.length > 0) findings.push(`普通贡献不得删除测试：${deletedTests.join(', ')}`)
              }

              if (findings.length > 0) {
                await writeStatus('failure', '受保护治理边界检查失败')
                core.setFailed(findings.join('\n'))
              } else {
                await writeStatus('success', governanceOverride ? '治理变更已明确标记并通过结构检查' : '未绕过受保护治理规则')
              }
            } catch (error) {
              await writeStatus('error', '治理守卫执行异常')
              throw error
            }
